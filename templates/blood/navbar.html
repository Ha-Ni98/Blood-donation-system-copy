{% load i18n %}

<style>
  /* نخلي نفس الشكل (brand font) */
  .navbar-brand {
    font-size: 20px;
    font-family: sans-serif;
  }

  /* أهم شيء: navbar فوق الـ hero */
  .navbar {
    z-index: 3000;
  }
</style>

<nav style="background-color: #FF0018;" class="navbar navbar-expand-md navbar-dark fixed-top">
  <a href="/" class="navbar-brand">
    <i class="fas fa-heartbeat"></i>&nbsp;
    {% trans "Blood Bank Management" %}
  </a>

  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse"
          aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- ✅ Collapse واحد فقط (نحّينا التداخل الزائد اللي يسبب مشاكل) -->
  <div class="collapse navbar-collapse" id="navbarCollapse">
    <ul class="navbar-nav ml-auto align-items-md-center">

      <li class="nav-item">
        <a class="nav-link" style="color: white;" href="/">
          <i class="fas fa-home"></i>&nbsp; {% trans "Home" %}
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" style="color: white;" href="/patient/patientlogin">
          <i class="fas fa-procedures"></i>&nbsp; {% trans "Patient" %}
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" style="color: white;" href="/donor/donorlogin">
          <i class="fas fa-user"></i>&nbsp; {% trans "Donor" %}
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" style="color: white;" href="/adminlogin">
          <i class="fas fa-user-shield"></i>&nbsp; {% trans "Admin" %}
        </a>
      </li>

      <!-- 🌐 Language Selector -->
      <li class="nav-item ml-md-2 mt-2 mt-md-0">
        <form action="{% url 'set_language' %}" method="post" class="m-0">
          {% csrf_token %}
          <input name="next" type="hidden" value="{{ request.get_full_path }}">

          <select name="language"
                  onchange="this.form.submit()"
                  class="form-control form-control-sm"
                  style="background-color:#FF0018;color:white;border:1px solid rgba(255,255,255,.4);">
            {% get_current_language as LANGUAGE_CODE %}
            {% get_available_languages as LANGUAGES %}
            {% for lang in LANGUAGES %}
              <option value="{{ lang.0 }}" {% if lang.0 == LANGUAGE_CODE %}selected{% endif %}>
                {{ lang.1 }}
              </option>
            {% endfor %}
          </select>
        </form>
      </li>

    </ul>
  </div>
</nav>
