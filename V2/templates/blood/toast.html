{% if messages %}
<div aria-live="polite" aria-atomic="true" class="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1050;">
    {% for message in messages %}
    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-primary{% endif %} alert-dismissible fade show" role="alert" style="min-width: 300px;">
        <strong>Notification</strong><br>
        {{ message }}
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
